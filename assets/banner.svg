<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: url(#textGrad); }
      .sub-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; fill: #9ca3af; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #e5e7eb; }
      .pulse-bg { animation: pulse 4s ease-in-out infinite; }
      .floating-1 { animation: floatNode 3s ease-in-out infinite; }
      .floating-2 { animation: floatNode 4s ease-in-out infinite 1s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Decorative Animated Grid & Glows -->
  <circle cx="200" cy="100" r="180" fill="#3b82f6" opacity="0.08" class="pulse-bg" filter="blur(40px)"/>
  <circle cx="1000" cy="280" r="200" fill="#8b5cf6" opacity="0.1" class="pulse-bg" filter="blur(40px)"/>

  <!-- Connection Network Graphic -->
  <g stroke="#374151" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6">
    <line x1="150" y1="190" x2="320" y2="120"/>
    <line x1="150" y1="190" x2="320" y2="260"/>
    <line x1="320" y1="120" x2="500" y2="190"/>
    <line x1="320" y1="260" x2="500" y2="190"/>
    <line x1="700" y1="190" x2="880" y2="120"/>
    <line x1="700" y1="190" x2="880" y2="260"/>
    <line x1="880" y1="120" x2="1050" y2="190"/>
    <line x1="880" y1="260" x2="1050" y2="190"/>
  </g>

  <!-- Glowing Animated Nodes -->
  <g class="floating-1">
    <circle cx="150" cy="190" r="18" fill="#1e293b" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <text x="150" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#60a5fa" font-weight="bold">SaaS</text>
  </g>

  <g class="floating-2">
    <circle cx="1050" cy="190" r="18" fill="#1e293b" stroke="#ec4899" stroke-width="3" filter="url(#glow)"/>
    <text x="1050" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f472b6" font-weight="bold">OSS</text>
  </g>

  <!-- Center Main Content -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="420" y="45" width="360" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="600" y="66" class="badge-text" fill="#a5b4fc">🗳️ Institutional &amp; Open Governance Ecosystem</text>

    <!-- Main Title -->
    <text x="600" y="145" class="title-text" font-size="44">Awesome Proxy Voting Platform</text>
    
    <!-- Subtitle -->
    <text x="600" y="190" class="sub-text" font-size="20">Curated Institutional SaaS Solutions &amp; Verifiable Open-Source Infrastructure</text>

    <!-- Feature Tags -->
    <g transform="translate(240, 240)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#111827" stroke="#374151"/>
      <text x="80" y="23" class="badge-text">🏢 Institutional SaaS</text>

      <rect x="180" y="0" width="170" height="36" rx="8" fill="#111827" stroke="#374151"/>
      <text x="265" y="23" class="badge-text">⚡ Voting Analytics</text>

      <rect x="360" y="0" width="180" height="36" rx="8" fill="#111827" stroke="#374151"/>
      <text x="450" y="23" class="badge-text">🔐 Verifiable Ballots</text>

      <rect x="550" y="0" width="170" height="36" rx="8" fill="#111827" stroke="#374151"/>
      <text x="635" y="23" class="badge-text">📜 On-Chain &amp; Off-Chain</text>
    </g>

    <!-- Bottom Accent Line -->
    <rect x="350" y="320" width="500" height="4" rx="2" fill="url(#accentGrad)" filter="url(#glow)"/>
  </g>
</svg>
